# Local development dependencies. The API itself runs on the host (pnpm start:dev).
#
#   docker compose up -d
#
# MongoDB   → mongodb://localhost:27017
# Logto     → OIDC http://localhost:3001, admin console http://localhost:3002
# Maildev   → SMTP localhost:1025, inbox UI http://localhost:1080
# RustFS    → S3 API http://localhost:9000, console http://localhost:9001 (rustfsadmin / rustfsadmin)

name: nestjs12-boilerplate

services:
  mongodb:
    image: mongo:8.3
    ports:
      - '27018:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  logto:
    image: svhd/logto:1.43.0
    depends_on:
      logto-db:
        condition: service_healthy
    # Seeds Logto's own schema on first start ("--swe": skip when it exists).
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    ports:
      - '3001:3001' # OIDC / auth endpoints (LOGTO_ENDPOINT)
      - '3002:3002' # Admin console
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgres://postgres:postgres@logto-db:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  logto-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logto
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned subfolder of this path.
      - logto-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'logto']
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - '1025:1025' # SMTP
      - '1080:1080' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:1080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data:
  logto-db-data:
  rustfs-data:
