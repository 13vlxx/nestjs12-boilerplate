# https://taskfile.dev
version: '3'
tasks:
  up:
    desc: Start the local dependencies (Postgres, Maildev, RustFS)
    cmds:
      - docker compose up -d --wait

  down:
    desc: Stop the local dependencies
    cmds:
      - docker compose down

  reset:
    desc: Stop the local dependencies and delete their data
    cmds:
      - docker compose down -v

  dev:
    desc: Start the application in development mode
    cmds:
      - nest start --watch

  lint:
    desc: Run the linter
    cmds:
      - pnpm lint

  format:
    desc: Format the sources
    cmds:
      - pnpm format

  prisma:migrate:
    desc: Create a migration from prisma/schema.prisma changes and apply it (task prisma:migrate -- --name <name>)
    cmds:
      - pnpm prisma:migrate {{.CLI_ARGS}}

  prisma:deploy:
    desc: Apply the pending migrations
    cmds:
      - pnpm prisma:deploy

  prisma:generate:
    desc: Generate the Prisma Client into src/_generated/prisma
    cmds:
      - pnpm prisma:generate

  prisma:studio:
    desc: Open Prisma Studio
    cmds:
      - pnpm prisma:studio

  seed:
    desc: Apply the migrations, empty every table and insert the seed data
    cmds:
      - pnpm seed

  build:
    desc: Generate the Prisma Client and build the application
    cmds:
      - pnpm build
