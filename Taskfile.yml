# https://taskfile.dev
version: '3'
tasks:
  up:
    desc: Start the local dependencies (MongoDB, Logto, Maildev, RustFS)
    cmds:
      - docker compose up -d --wait

  down:
    desc: Stop the local dependencies
    cmds:
      - docker compose down

  reset:
    desc: Stop the local dependencies and delete their data
    cmds:
      - docker compose down -v

  dev:
    desc: Start the application in development mode
    cmds:
      - pnpm start:dev

  lint:
    desc: Run the linter
    cmds:
      - pnpm lint

  format:
    desc: Format the sources
    cmds:
      - pnpm format

  seed:
    desc: Drop MongoDB and create the missing API resource, roles and users in Logto
    cmds:
      - pnpm seed

  build:
    desc: Build the application
    cmds:
      - nest build
